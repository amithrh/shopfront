<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AskOnce · voice host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --desk: #dfe3e8; --desk-ink: #26303c; --desk-muted: #5d6877; --panel: #f6f7f9; --panel-line: #cfd5dd;
  --bezel: #2b2e33; --screen: #16263a; --screen-2: #1e3149; --screen-line: #2e4560;
  --text: #f3f5f8; --muted: #9fb0c4;
  --listen: #f5b544; --speak: #7cc4ff; --owner: #c6a7ff; --ok: #78d39a; --bad: #ff9a8a;
  --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --desk: #1c2027; --desk-ink: #e7ebf0; --desk-muted: #9aa5b4; --panel: #242a33; --panel-line: #353d49; --bezel: #0d0f12; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--desk); color: var(--desk-ink); font-family: var(--font); }
body { min-height: 100vh; padding: 24px 16px 40px; }
.stage { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
@media (max-width: 1000px) { .stage { grid-template-columns: 1fr; } }

/* ---------------------------------------------------------------- the device */
.device { background: var(--bezel); border-radius: 28px; padding: 18px 18px 22px; box-shadow: 0 30px 60px -30px rgba(10, 20, 35, .55); }
.screen { position: relative; aspect-ratio: 16 / 10; background: radial-gradient(120% 90% at 20% 0%, var(--screen-2), var(--screen) 60%);
  border-radius: 12px; overflow: hidden; color: var(--text); display: grid; grid-template-rows: auto 1fr auto; container-type: inline-size; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 2.2cqw 3cqw 0; color: var(--muted); font-size: max(12px, 1.5cqw); }
.topbar b { color: var(--text); font-weight: 700; }
.body { display: grid; grid-template-columns: 1fr minmax(0, .92fr); gap: 3cqw; padding: 2cqw 3cqw; min-height: 0; }
.body.solo { grid-template-columns: 1fr; }
.talk { align-self: center; min-width: 0; transition: opacity .2s; }
.screen.asking .talk, .screen.asking .cardslot { opacity: .12; }
.heard { color: var(--muted); font-size: max(13px, 1.9cqw); margin: 0 0 1.4cqw; min-height: 1.3em; }
.heard.live { font-style: italic; }
.reply { font-size: max(18px, 3.5cqw); line-height: 1.22; margin: 0; letter-spacing: -0.005em; text-wrap: pretty; }
.reply.idle { color: var(--muted); }
.cardslot { align-self: center; min-width: 0; max-height: 100%; overflow: auto; scrollbar-width: thin; }

.card { background: rgba(255, 255, 255, .06); border: 1px solid var(--screen-line); border-radius: 14px; padding: 2cqw 2.2cqw; font-size: max(12px, 1.55cqw); }
.card.owner { border-color: var(--owner); box-shadow: 0 0 0 1px var(--owner) inset; }
.card .kind { color: var(--muted); font-size: .85em; margin: 0 0 .3em; }
.card.owner .kind { color: var(--owner); }
.card h3 { margin: 0; font-size: 1.35em; line-height: 1.2; }
.card .subtitle { color: var(--muted); margin: .2em 0 0; }
.badges { display: flex; flex-wrap: wrap; gap: .4em; margin: .7em 0 0; }
.badge { border: 1px solid var(--screen-line); border-radius: 999px; padding: .1em .65em; font-size: .9em; }
.lines { display: grid; gap: .55em; margin: .8em 0 0; }
.lines div { display: grid; gap: .05em; }
.lines dt { color: var(--muted); font-size: .85em; } .lines dd { margin: 0; overflow-wrap: anywhere; }
.cites { margin: .9em 0 0; padding: .7em 0 0; border-top: 1px solid var(--screen-line); display: grid; gap: .55em; }
.cite { display: grid; grid-template-columns: auto 1fr; gap: .6em; align-items: start; }
.cite svg { width: 1.05em; height: 1.05em; margin-top: .15em; color: var(--ok); }
.cite q { display: block; font-style: italic; }
.cite small { display: block; color: var(--muted); font-size: .85em; }
.actions { display: flex; flex-wrap: wrap; gap: .5em; margin: .9em 0 0; }
.actions button, .ask button { font: inherit; border-radius: 999px; padding: .45em 1.1em; border: 1px solid var(--screen-line); background: rgba(255,255,255,.08); color: var(--text); cursor: pointer; }
.actions button:hover, .ask button:hover { background: rgba(255,255,255,.14); }

/* the light bar: the device's one bold element */
.bar { height: max(6px, .9cqw); margin: 0 3cqw 2cqw; border-radius: 999px; background: rgba(255,255,255,.06); position: relative; overflow: hidden; }
.bar::after { content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0; transition: opacity .25s, background .25s; }
.screen[data-state="listening"] .bar::after { opacity: 1; background: var(--listen); animation: breathe 1.4s ease-in-out infinite; }
.screen[data-state="waiting"] .bar::after { opacity: 1; background: var(--listen); }
.screen[data-state="thinking"] .bar::after { opacity: 1; background: linear-gradient(90deg, transparent, var(--speak), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: sweep 1.1s linear infinite; }
.screen[data-state="speaking"] .bar::after { opacity: 1; background: var(--speak); }
.screen[data-state="announce"] .bar::after { opacity: 1; background: var(--owner); animation: breathe .9s ease-in-out 3; }
@keyframes breathe { 50% { opacity: .45; } }
@keyframes sweep { from { background-position: -40% 0; } to { background-position: 140% 0; } }
@media (prefers-reduced-motion: reduce) { .bar::after { animation: none !important; } }

/* questions from a tool (confirm, missing details) */
.ask { position: absolute; inset: auto 3cqw 4.5cqw; background: var(--screen-2); border: 1px solid var(--listen); border-radius: 14px; padding: 2cqw 2.4cqw;
  font-size: max(13px, 1.7cqw); box-shadow: 0 20px 40px -20px rgba(0,0,0,.6); max-height: 78%; overflow: auto; }
.ask p { margin: 0 0 .8em; font-size: 1.12em; line-height: 1.3; }
.ask form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .7em 1em; }
.ask label { display: grid; gap: .25em; color: var(--muted); font-size: .9em; }
.ask input, .ask select { font: inherit; color: var(--text); background: rgba(255,255,255,.07); border: 1px solid var(--screen-line); border-radius: 8px; padding: .45em .6em; }
.ask .row { display: flex; gap: .6em; grid-column: 1 / -1; }
.ask button.yes { background: var(--listen); color: #2a1d00; border-color: var(--listen); font-weight: 700; }

.controls { display: flex; gap: 12px; align-items: center; margin-top: 18px; }
.mic { flex: none; width: 56px; height: 56px; border-radius: 50%; border: 0; background: #3a3f47; color: #fff; cursor: pointer; display: grid; place-items: center; }
.mic svg { width: 24px; height: 24px; }
.mic[aria-pressed="true"] { background: var(--listen); color: #2a1d00; }
.mic:disabled { opacity: .4; cursor: default; }
.say { flex: 1; display: flex; gap: 8px; min-width: 0; }
.say input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 14px 16px; border-radius: 14px; border: 1px solid #3a3f47; background: #24282e; color: #f3f5f8; }
.say button { font: inherit; font-weight: 700; padding: 0 18px; border-radius: 14px; border: 0; background: var(--speak); color: #0c2236; cursor: pointer; }
:focus-visible { outline: 3px solid var(--listen); outline-offset: 2px; }

/* ---------------------------------------------------------------- behind the scenes */
.side { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px; padding: 16px; display: grid; gap: 14px; font-size: 14px; }
.side h2 { font-size: 15px; margin: 0; }
.side .note { color: var(--desk-muted); margin: 2px 0 0; font-size: 13px; }
.side .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.side button, .side select { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--panel-line); background: transparent; color: var(--desk-ink); cursor: pointer; }
.log { max-height: 56vh; overflow: auto; display: grid; gap: 6px; align-content: start; scrollbar-width: thin; }
.log div { line-height: 1.35; overflow-wrap: anywhere; }
.log .you { font-weight: 700; }
.log .bot { }
.log .tool { color: var(--desk-muted); font-size: 12.5px; padding-left: 10px; border-left: 2px solid var(--panel-line); }
.log .tool b { color: var(--desk-ink); font-weight: 700; }
.log .ann { color: #6a43b5; font-weight: 700; }
@media (prefers-color-scheme: dark) { .log .ann { color: var(--owner); } }
.log .err { color: #b4372f; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; color: var(--desk-muted); }
.stats span:nth-child(even) { color: var(--desk-ink); text-align: right; font-variant-numeric: tabular-nums; }
.banner { background: #fff3d6; color: #5a3d00; border-radius: 12px; padding: 10px 12px; font-size: 13px; }
</style>
</head>
<body>
<div class="stage">
  <section aria-label="Device">
    <div class="device">
      <div class="screen" id="screen" data-state="idle">
        <div class="topbar"><span><b id="where">Local businesses</b></span><span id="clock"></span></div>
        <div class="body solo" id="body">
          <div class="talk" aria-live="polite">
            <p class="heard" id="heard"></p>
            <p class="reply idle" id="reply">Try “Is there a bakery in Portland that does a gluten-free cake for 30 people?”</p>
          </div>
          <div class="cardslot" id="cardslot" hidden></div>
        </div>
        <div class="bar" aria-hidden="true"></div>
        <div class="ask" id="ask" hidden role="dialog" aria-live="assertive"></div>
      </div>
    </div>
    <div class="controls">
      <button class="mic" id="mic" type="button" aria-pressed="false" aria-label="Talk (hold Space)" title="Talk (hold Space)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <form class="say" id="sayform">
        <input id="sayinput" autocomplete="off" placeholder="Talk, or type what the customer says" aria-label="What the customer says">
        <button type="submit">Say</button>
      </form>
    </div>
  </section>

  <aside class="side" aria-label="Behind the scenes">
    <div>
      <h2>Behind the scenes</h2>
      <p class="note">What the assistant did with the AskOnce MCP tools. The device shows only the reply and the card.</p>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="buttons">
      <select id="ownerbiz" aria-label="Owner">
        <option value="thimbleberry-bakehouse">Rosa · bakery</option>
        <option value="quillfern-salon">Inés · salon</option>
        <option value="kettlewick-home">Jo · home repair</option>
      </select>
      <button type="button" id="owner">Open owner's phone</button>
      <button type="button" id="reset">New conversation</button>
      <button type="button" id="voiceon" aria-pressed="true">Voice on</button>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="stats">
      <span>Model</span><span id="model">–</span>
      <span>Last turn</span><span id="turn">–</span>
      <span>Bedrock spend</span><span id="spend">–</span>
      <span>MCP</span><span id="proto">connecting…</span>
    </div>
  </aside>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const screen = $("screen");
  let sid = null, speakOn = true, lastInputWasVoice = false, currentAsk = null;

  // ---------------------------------------------------------------- state + clock
  let baseState = "idle";
  function setState(s) { baseState = s; if (!speaking && !listening) screen.dataset.state = s; }
  const tick = () => { $("clock").textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };
  tick(); setInterval(tick, 15000);

  // ---------------------------------------------------------------- speech out
  let voice = null, speaking = false;
  function pickVoice() {
    const vs = speechSynthesis.getVoices().filter((v) => v.lang && v.lang.startsWith("en"));
    const want = ["Ava", "Samantha", "Allison", "Google US English", "Microsoft Aria", "Zoe"];
    voice = want.map((n) => vs.find((v) => v.name.includes(n))).find(Boolean) || vs.find((v) => v.lang === "en-US") || vs[0] || null;
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text, state = "speaking") {
    return new Promise((resolve) => {
      if (!speakOn || !("speechSynthesis" in window) || !text) { resolve(); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice; u.rate = 1.03;
      speaking = true; screen.dataset.state = state;
      u.onend = u.onerror = () => { speaking = false; screen.dataset.state = baseState; resolve(); };
      speechSynthesis.speak(u);
    });
  }
  function chime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [660, 880].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; o.type = "sine";
        g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.16); g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + i * 0.16 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.16 + 0.35);
        o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + i * 0.16); o.stop(ctx.currentTime + i * 0.16 + 0.4);
      });
    } catch (e) { /* no audio */ }
  }

  // ---------------------------------------------------------------- speech in
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, onHeard = null;
  if (!SR) { $("mic").disabled = true; $("mic").title = "Speech recognition isn't available in this browser; type instead."; }
  function listen(handler) {
    if (!SR || listening) return;
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    onHeard = handler || sendSay;
    rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.maxAlternatives = 1;
    let finalText = "";
    rec.onresult = (ev) => {
      let interim = "";
      for (const r of ev.results) { if (r.isFinal) finalText = r[0].transcript; else interim += r[0].transcript; }
      $("heard").textContent = finalText || interim; $("heard").classList.add("live");
    };
    rec.onend = () => {
      listening = false; $("mic").setAttribute("aria-pressed", "false"); screen.dataset.state = baseState;
      $("heard").classList.remove("live");
      const text = finalText.trim(); if (text) { lastInputWasVoice = true; onHeard(text); }
    };
    rec.onerror = (ev) => { if (ev.error !== "no-speech" && ev.error !== "aborted") logLine("err", "Microphone: " + ev.error); };
    listening = true; $("mic").setAttribute("aria-pressed", "true"); screen.dataset.state = "listening";
    rec.start();
  }
  function stopListening() { if (rec && listening) rec.stop(); }
  $("mic").addEventListener("click", () => (listening ? stopListening() : listen(currentAsk ? answerByVoice : null)));
  let spaceDown = false;
  document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || spaceDown || e.repeat || /INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)) return;
    e.preventDefault(); spaceDown = true; listen(currentAsk ? answerByVoice : null);
  });
  document.addEventListener("keyup", (e) => { if (e.code === "Space" && spaceDown) { spaceDown = false; stopListening(); } });

  // ---------------------------------------------------------------- the log
  function logLine(cls, text, bold) {
    const d = el("div", cls);
    if (bold) { d.append(el("b", null, bold), document.createTextNode(" " + text)); } else d.textContent = text;
    $("log").append(d); $("log").scrollTop = $("log").scrollHeight;
  }
  const short = (v, n = 48) => { const s = typeof v === "string" ? v : JSON.stringify(v); return s.length > n ? s.slice(0, n - 1) + "…" : s; };

  // ---------------------------------------------------------------- cards
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
  const KIND = { business: "Business", items: "Menu", item: "Item", policy: "Policy", slots: "Open times", commitment: "Your request", task: "Waiting on the owner", handoff: "Not on their website", notice: "Note" };
  function host(url) { try { return new URL(url).host; } catch (e) { return url; } }
  function renderCard(card, opts = {}) {
    const c = el("div", "card" + (opts.owner ? " owner" : ""));
    c.append(el("p", "kind", opts.kindText || KIND[card.kind] || card.kind));
    c.append(el("h3", null, card.title));
    if (card.subtitle) c.append(el("p", "subtitle", card.subtitle));
    if (card.badges && card.badges.length) { const b = el("div", "badges"); card.badges.forEach((t) => b.append(el("span", "badge", t))); c.append(b); }
    if (card.lines && card.lines.length) {
      const dl = el("dl", "lines"); card.lines.slice(0, 9).forEach((l) => { const r = el("div"); r.append(el("dt", null, l.label), el("dd", null, l.value)); dl.append(r); }); c.append(dl);
    }
    if (card.citations && card.citations.length) {
      const box = el("div", "cites");
      card.citations.slice(0, 3).forEach((ct) => {
        const row = el("div", "cite"); const icon = el("span"); icon.innerHTML = CHECK; // static markup only
        const txt = el("div"); if (ct.quote) txt.append(el("q", null, ct.quote));
        const where = /^https?:/.test(ct.url) ? host(ct.url) : "";
        txt.append(el("small", null, [ct.title, where].filter(Boolean).join(", ") || "Source"));
        row.append(icon, txt); box.append(row);
      });
      c.append(box);
    }
    if (card.actions && card.actions.length && !opts.noActions) {
      const a = el("div", "actions");
      card.actions.slice(0, 3).forEach((act) => {
        const b = el("button", null, act.label); b.type = "button";
        b.addEventListener("click", () => {
          let args = { ...(act.arguments || {}) };
          if (act.input) {
            // collect the text in the say box (no dialogs), then send the action with it
            $("sayinput").placeholder = act.input.label; $("sayinput").focus();
            pendingInput = { act, args }; return;
          }
          post("action", { tool: act.tool, arguments: args });
        });
        a.append(b);
      });
      c.append(a);
    }
    return c;
  }
  let pendingInput = null;
  function showCard(card, opts) {
    const slot = $("cardslot"); slot.replaceChildren(renderCard(card, opts)); slot.hidden = false; $("body").classList.remove("solo");
    if (card.kind === "business" && card.title) $("where").textContent = card.title;
  }

  // ---------------------------------------------------------------- tool questions (elicitation)
  function isConfirm(schema) { const p = Object.keys((schema && schema.properties) || {}); return p.length === 0 || (p.length === 1 && p[0] === "confirm"); }
  const YES = /^(yes|yeah|yep|sure|ok|okay|go ahead|please do|do it|confirm|correct|that's right|sounds good)\b/i;
  function answerAsk(action, content) {
    if (!currentAsk) return;
    const id = currentAsk.id; currentAsk = null; $("ask").hidden = true; screen.classList.remove("asking");
    post("answer", { ask_id: id, action, content: content || {} });
  }
  function answerByVoice(text) {
    if (!currentAsk) { sendSay(text); return; }
    logLine("you", text);
    if (isConfirm(currentAsk.schema)) {
      const yes = YES.test(text.trim());
      const hasConfirm = "confirm" in (currentAsk.schema.properties || {});
      answerAsk(hasConfirm ? "accept" : (yes ? "accept" : "decline"), hasConfirm ? { confirm: yes } : {});
      return;
    }
    // a form: fill the focused (or first empty) field with what was said
    const form = $("ask").querySelector("form");
    const target = form && ([...form.elements].find((f) => f === document.activeElement && f.name) || [...form.elements].find((f) => f.name && !f.value));
    if (target) { target.value = text; const next = [...form.elements].find((f) => f.name && !f.value); if (next) next.focus(); }
  }
  function showAsk(ev) {
    currentAsk = ev; const box = $("ask"); box.replaceChildren(); box.hidden = false; screen.classList.add("asking");
    box.append(el("p", null, ev.message));
    const props = (ev.schema && ev.schema.properties) || {};
    const required = new Set((ev.schema && ev.schema.required) || []);
    if (isConfirm(ev.schema)) {
      const row = el("div", "row");
      const yes = el("button", "yes", "Yes"), no = el("button", null, "No");
      yes.type = no.type = "button";
      const hasConfirm = "confirm" in props;
      yes.onclick = () => { logLine("you", "Yes"); answerAsk("accept", hasConfirm ? { confirm: true } : {}); };
      no.onclick = () => { logLine("you", "No"); answerAsk(hasConfirm ? "accept" : "decline", hasConfirm ? { confirm: false } : {}); };
      row.append(yes, no); box.append(row);
    } else {
      const form = el("form");
      for (const [key, spec] of Object.entries(props)) {
        const label = el("label"); label.append(el("span", null, (spec.title || key.replace(/_/g, " ")) + (required.has(key) ? "" : " (optional)")));
        const choices = spec.enum || (spec.oneOf || []).filter((o) => "const" in o).map((o) => o.const);
        const titles = (spec.oneOf || []).filter((o) => "const" in o).map((o) => o.title || o.const);
        let input;
        if (choices.length) {
          input = el("select"); input.append(el("option", null, "Choose…")); input.firstChild.value = "";
          choices.forEach((c, i) => { const o = el("option", null, titles[i] || c); o.value = c; input.append(o); });
        } else if (spec.type === "boolean") {
          input = el("select"); [["", "Choose…"], ["yes", "Yes"], ["no", "No"]].forEach(([v, t]) => { const o = el("option", null, t); o.value = v; input.append(o); });
        } else {
          input = el("input"); input.type = spec.format === "email" ? "email" : (spec.type === "integer" || spec.type === "number") ? "number" : spec.format === "date" ? "date" : "text";
        }
        input.name = key; if (required.has(key)) input.required = true;
        label.append(input); form.append(label);
      }
      const row = el("div", "row"); const send = el("button", "yes", "Send"), cancel = el("button", null, "Cancel");
      send.type = "submit"; cancel.type = "button";
      cancel.onclick = () => answerAsk("cancel");
      row.append(send, cancel); form.append(row);
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const content = {};
        for (const f of form.elements) if (f.name && f.value !== "") content[f.name] = f.value;
        logLine("you", Object.values(content).join(", ") || "(nothing)");
        answerAsk("accept", content);
      });
      box.append(form);
      setTimeout(() => { const f = form.querySelector("input, select"); if (f) f.focus(); }, 0);
    }
    setState("waiting");
    speak(ev.message, "waiting").then(() => { if (lastInputWasVoice && currentAsk === ev && isConfirm(ev.schema)) listen(answerByVoice); });
  }

  // ---------------------------------------------------------------- events from the host
  function onEvent(ev) {
    switch (ev.type) {
      case "ready":
        $("proto").textContent = ev.protocol + " · " + ev.tools + " tools";
        if (!ev.models.length) banner("No Bedrock credentials. Run aws login --profile shopfront, then restart the host.");
        break;
      case "state": setState(ev.state); break;
      case "you": $("heard").textContent = ev.text; $("heard").classList.remove("live"); logLine("you", ev.text); break;
      case "tool":
        logLine("tool", Object.entries(ev.args || {}).filter(([k]) => k !== "business_id").map(([k, v]) => k + "=" + short(v)).join(", ") + " → " + ev.status + (ev.task_id ? " · task " + ev.task_id.slice(0, 10) : "") + " · " + ev.ms + " ms", ev.name);
        break;
      case "card": showCard(ev.card); break;
      case "ask": showAsk(ev); break;
      case "ask_done": if (currentAsk && currentAsk.id === ev.id) { currentAsk = null; $("ask").hidden = true; screen.classList.remove("asking"); } break;
      case "reply":
        $("reply").textContent = ev.text; $("reply").classList.remove("idle"); logLine("bot", ev.text);
        speak(ev.text).then(() => { if (lastInputWasVoice && /\?\s*$/.test(ev.text) && !currentAsk) listen(); });
        break;
      case "announce":
        chime(); screen.dataset.state = "announce";
        $("heard").textContent = "Just now";
        $("reply").textContent = ev.text; $("reply").classList.remove("idle");
        if (ev.card) showCard(ev.card, { owner: true, kindText: "The owner replied", noActions: false });
        logLine("ann", ev.text);
        setTimeout(() => speak(ev.text, "announce"), 650);
        break;
      case "model":
        $("model").textContent = ev.model.replace(/^(apac|au|global|us)\./, "").replace(/-v\d.*$/, "");
        break;
      case "spend":
        if (ev.turn != null) $("turn").textContent = "$" + ev.turn.toFixed(4);
        $("spend").textContent = "$" + ev.total.toFixed(2) + " of $" + ev.budget.toFixed(2);
        break;
      case "error": logLine("err", ev.text); banner(ev.text); setState("idle"); break;
      case "reset":
        $("log").replaceChildren(); $("cardslot").hidden = true; $("body").classList.add("solo"); $("heard").textContent = "";
        $("reply").textContent = "New conversation."; $("reply").classList.add("idle"); $("where").textContent = "Local businesses"; break;
    }
  }
  function banner(text) { $("banner").textContent = text; $("banner").hidden = false; }

  // ---------------------------------------------------------------- wiring
  async function post(path, body) {
    const res = await fetch("/api/sessions/" + sid + "/" + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    if (res.status === 404) { banner("The host restarted. Reload the page."); }
    return res;
  }
  function sendSay(text) {
    text = (text || "").trim(); if (!text) return;
    if (currentAsk) { answerByVoice(text); return; }
    if (pendingInput) {
      const { act, args } = pendingInput; pendingInput = null; $("sayinput").placeholder = "Talk, or type what the customer says";
      logLine("you", text); post("action", { tool: act.tool, arguments: { ...args, [act.input.key]: text } }); return;
    }
    const direct = text.match(/^\/tool\s+(\w+)\s*(\{.*\})?$/s); // dev: call a tool directly, no model
    if (direct) { logLine("you", text); post("action", { tool: direct[1], arguments: direct[2] ? JSON.parse(direct[2]) : {} }); return; }
    post("say", { text });
  }
  $("sayform").addEventListener("submit", (e) => { e.preventDefault(); lastInputWasVoice = false; const t = $("sayinput").value; $("sayinput").value = ""; sendSay(t); });
  $("reset").addEventListener("click", () => post("reset"));
  $("voiceon").addEventListener("click", (e) => {
    speakOn = !speakOn; e.target.setAttribute("aria-pressed", String(speakOn)); e.target.textContent = speakOn ? "Voice on" : "Voice off";
    if (!speakOn && "speechSynthesis" in window) speechSynthesis.cancel();
  });
  $("owner").addEventListener("click", async () => {
    const biz = $("ownerbiz").value;
    const win = window.open("", "owner-" + biz, "popup,width=400,height=820");
    try {
      const res = await fetch("/api/owner-link/" + encodeURIComponent(biz));
      if (!res.ok) throw new Error("HTTP " + res.status);
      const { url } = await res.json();
      if (win) win.location = url; else location.assign(url);
    } catch (e) { if (win) win.close(); logLine("err", "Couldn't open the owner's page: " + e.message); }
  });

  async function start() {
    const res = await fetch("/api/sessions", { method: "POST" });
    sid = (await res.json()).id;
    const es = new EventSource("/api/sessions/" + sid + "/events");
    es.onmessage = (m) => onEvent(JSON.parse(m.data));
    es.onerror = () => { $("proto").textContent = "reconnecting…"; };
  }
  start();
})();
</script>
</body>
</html>
